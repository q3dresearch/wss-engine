# Example registry entry. Copy into a domain repo as
# registry/<source_id>.yml — the filename must match source_id.
source_id: example.web.stats
status: paused            # start paused; run `snapshotter doctor example.web.stats`,
                          # read the raw response, then flip to active
cadence: daily
schema_id: example.v1

publisher: Example Org
publisher_tier: first_party
destroys_own_history: true       # they only expose a rolling window
licence: "see https://example.com/terms"
personal_data: none
storage: git

endpoints:
  - url: https://example.com/api/stats
    delay_seconds: 2

gates:
  expect_status: 200
  min_bytes: 500
  content_type_any: [json]
  must_contain: ["count"]
  must_not_contain: ["Access Denied", "rate limit"]
  max_shrink_pct: 50

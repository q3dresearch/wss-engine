# There is never a workflow per source: this shards whatever the registry
# marks active at this cadence. Adding a source touches nothing here.
#
# Weekly is the floor: a daily capture has never changed a decision this fleet
# makes, so the template does not ship one. For a monthly source, copy this file
# and change three things: the workflow `name`, the cron, and `CADENCE`.
name: capture-weekly

on:
  schedule:
    - cron: "10 22 * * 1" # Monday, off the hour — GitHub's scheduler is contended at :00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fleet-commits
  cancel-in-progress: false

env:
  # Workflow-level so EVERY job has it, not just capture. `wss plan` now
  # checks it too, so the run fails once at the top instead of identically
  # in every shard. No setup required: GitHub supplies owner and repo, and
  # a fork sends its own. Set a WSS_CONTACT secret only to override.
  WSS_CONTACT: ${{ secrets.WSS_CONTACT || format('{0} +https://github.com/{1}', github.repository_owner, github.repository) }}
  CADENCE: weekly
  SHARDS: "20" # matrix cap is 256 jobs/run — aim for ~20 jobs of ~50 sources
  ENGINE_SPEC: "wss @ git+https://github.com/${{ github.repository_owner }}/wss-engine.git@v{{ENGINE_VERSION}}"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install "$ENGINE_SPEC"
      - name: Validate registry (hard gate)
        run: wss validate
      - name: Plan shards
        id: plan
        # Assign, never `echo "shards=$(wss plan ...)"`. Command substitution
        # inside echo yields *echo's* exit status, so a failing plan reports
        # success -- which is precisely how an empty matrix stayed green.
        run: |
          shards=$(wss plan --cadence "$CADENCE" --shards "$SHARDS")
          count=$(wss plan --cadence "$CADENCE" --shards "$SHARDS" --count)
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

  capture:
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false # one bad source must not stop the rest of the fleet
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    # env:  (no credentials needed by this repo)
    # Add one line per authenticated source, matching the
    # `auth: {bearer_env: ...}` name in its registry entry, e.g.
    # WSS_SOMEPUBLISHER_KEY: ${{ secrets.WSS_SOMEPUBLISHER_KEY }}
    # This is the one workflow edit a new *credential* requires — adding a
    # source never needs one.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install "$ENGINE_SPEC"
      - name: Capture shard ${{ matrix.shard }}
        env:
          # Harmless when every source declares `storage: git` -- the variables
          # are simply empty. REQUIRED the moment one declares `storage: object`,
          # because object_config() then resolves to an entirely empty config and
          # the job cannot write a byte. wss-drug-scarcity ran red for three days
          # before anyone looked, so the wiring ships by default rather than
          # being remembered at the point it is needed.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          WSS_OBJECT_PREFIX: ${{ secrets.WSS_OBJECT_PREFIX }}
        run: wss capture --cadence "$CADENCE" --shard "${{ matrix.shard }}"
      - name: Pack shard delta (new files only)
        if: always()
        run: |
          git add -A raw manifest 2>/dev/null || true
          { git diff --cached --name-only; find quarantine -type f 2>/dev/null || true; } > /tmp/delta-files.txt
          if [ -s /tmp/delta-files.txt ]; then
            tar -czf shard-delta.tgz --files-from=/tmp/delta-files.txt
          fi
      - name: Upload shard delta
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capture-${{ env.CADENCE }}-${{ strategy.job-index }}
          path: shard-delta.tgz
          if-no-files-found: ignore
          retention-days: 90

  commit:
    needs: [plan, capture]
    # always(): a red shard still gets its successful sources committed
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: capture-${{ env.CADENCE }}-*
          merge-multiple: false
          path: /tmp/deltas
      - name: Unpack shard deltas
        run: |
          find /tmp/deltas -name 'shard-delta.tgz' -print0 | while IFS= read -r -d '' f; do
            tar -xzf "$f"
          done
      - name: Drop quarantine (triage lives in CI artifacts, never in git)
        run: rm -rf quarantine
      # Records what was attempted, not just that the cron fired. The old
      # heartbeat proved liveness only, so two repos wrote a perfect one every
      # run while capturing nothing: sources_planned is what tells those apart.
      - name: Heartbeat — what this run actually planned
        run: |
          mkdir -p state
          printf '{"cadence":"%s","sources_planned":%s,"completed_at":"%s","run_id":"%s","workflow":"%s"}\n' \
            "$CADENCE" "${{ needs.plan.outputs.count }}" "$(date -u +%FT%TZ)" \
            "${{ github.run_id }}" "${{ github.workflow }}" \
            > state/last_run.json
      - name: Commit with rebase-retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A raw manifest state
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "capture($CADENCE): run ${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $((i * 5))
            # `git pull --rebase` leaves a CONFLICTED TREE when it fails, and
            # the next push then fails for a different reason than the first.
            # Abort so each attempt starts clean; `merge=union` in
            # .gitattributes resolves the append-only manifest automatically,
            # and anything it cannot resolve now fails loudly on attempt one
            # instead of being disguised as five push failures.
            if ! git pull --rebase; then
              git rebase --abort || true
              echo "rebase conflict on attempt $i -- not a push race" >&2
            fi
          done
          echo "push failed after 5 attempts" >&2
          exit 1

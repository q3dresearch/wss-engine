# Validation is a hard gate: an invalid registry entry never lands on main.
name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ENGINE_SPEC: "wss @ git+https://github.com/${{ github.repository_owner }}/wss-engine.git@v{{ENGINE_VERSION}}"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install "$ENGINE_SPEC"
      - name: Validate registry
        run: wss validate

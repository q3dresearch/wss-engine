# EXAMPLE ENTRY — copy it, rename the file to <source_id>.yml, edit, then
# delete this one. The filename must always match source_id.
#
# It ships `paused` so a fresh repo validates and captures nothing until you
# have run `wss doctor example.web.stats` and read the raw response.
source_id: example.web.stats     # publisher.domain.series — IMMUTABLE, never reused
status: paused                   # active | paused | auto_disabled | retired
cadence: monthly                 # weekly | monthly | quarterly
schema_id: example.v1            # picks the parser in parsers/

publisher: Example Org
publisher_tier: first_party      # first_party | primary | redistribution
# false means the publisher archives its own history, so capturing adds
# nothing — an active source with false is rejected by validate.
destroys_own_history: true
licence: "see https://example.com/terms"
personal_data: none              # `present` is rejected outright
storage: git                     # git | object (S3/R2 for large sources)

notes: >-
  What question does this source answer? One or two lines. Future you will
  want to know why this was worth capturing.

endpoints:
  - url: https://example.com/api/stats
    delay_seconds: 2             # per-host politeness delay

gates:
  expect_status: 200             # or a list, e.g. [200, 404], when a 404 is data
  min_bytes: 500
  content_type_any: [json]
  must_contain: ["count"]
  must_not_contain: ["Access Denied", "rate limit"]
  max_shrink_pct: 50
